name: An idea
description: Something CirrusUX could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you'd like to do
      description: The job you're trying to get done, not just the feature.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it might work
