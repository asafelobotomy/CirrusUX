# Runs the same checks as `make test`, plus the race detector and the host
# script tests, on every push and pull request. Actions are pinned to
# commits, like images are pinned to digests.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        run: make web
      - name: Test
        run: make test
      - name: Race detector
        run: go test -race ./...
      - name: Host scripts
        # Ubuntu's AppArmor blocks unprivileged user namespaces, which the
        # module tests run in; this throwaway runner may allow them.
        # A skipped test fails the step here: CI should run all of them.
        shell: bash # with pipefail, so a failing test still fails the step
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y --no-install-recommends shellcheck nftables
          make test-host 2>&1 | tee "$RUNNER_TEMP/host.log"
          ! grep -q '^skipping' "$RUNNER_TEMP/host.log"
      - name: Build
        run: make build
