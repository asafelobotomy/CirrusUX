# Builds the binaries for a version tag (vX.Y.Z) and publishes them, with
# their checksums, as a GitHub release. Actions are pinned to commits.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release; no other job has this
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        run: make web
      - name: Build the bundles
        shell: bash
        run: |
          set -euo pipefail
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)" >&2; exit 1; }
          for arch in amd64 arm64; do
            scripts/bundle.sh "${GITHUB_REF_NAME#v}" "$arch" dist
          done
          cp install.sh dist/
          cd dist
          sha256sum ./*.tar.gz install.sh | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the bundles
        # GitHub keeps attestations only for public repositories (and
        # organisations' private ones); skipped while this one is private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz, dist/install.sh'
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/install.sh dist/SHA256SUMS \
            --title "CirrusUX ${GITHUB_REF_NAME#v}" --verify-tag \
            --notes "Ready-to-install bundles (static binaries and setup, amd64 and arm64). Install with install.sh, which checks them against SHA256SUMS; see docs/INSTALL.md."
